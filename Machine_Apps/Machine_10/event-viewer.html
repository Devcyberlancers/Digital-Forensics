<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Vault Breach - Event Viewer and text decoder</title><style>:root{color-scheme:dark;font:16px/1.6 Arial,sans-serif;background:#111006;color:#eee}*{box-sizing:border-box}body{max-width:1500px;margin:auto;padding:30px}h1,h2,summary{color:#facc15}h1{letter-spacing:-.04em}p{color:#d2cbb0}.panel,article{padding:20px;border:1px solid #facc1540;border-radius:14px;background:#201d10;margin:16px 0}input,button,select{font:inherit;background:#100f08;color:#eee;border:1px solid #facc1560;border-radius:7px;padding:10px;max-width:100%}input[type=search]{width:100%}button{cursor:pointer;background:#facc15;color:#171307;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 Consolas,monospace;background:#0b0a06;padding:16px;border-radius:8px}code{color:#fde68a;overflow-wrap:anywhere}.error{color:#fca5a5}small{color:#cfc5a4}label{display:block;margin:10px 0}textarea{display:block;width:100%;min-height:100px;background:#0b0a06;color:#eee;border:1px solid #9e8c39;border-radius:7px;padding:12px;font:14px monospace}a{color:#fde68a}:focus-visible{outline:3px solid #facc15;outline-offset:3px}@media(max-width:600px){body{padding:14px}article{padding:12px}}</style><body><h1>Event Viewer and text decoder</h1><p>Read local JSONL audit records. Match identifiers and clock sources before drawing conclusions.</p><div class="panel"><label>Choose extracted audit.jsonl or egress_receipts.jsonl <input id="file" type="file" accept=".jsonl,.ndjson"></label><label>Search any identifier or event <input id="search" type="search" placeholder="Session, job, event or hash"></label><p id="count">No records loaded.</p><p id="error" class="error" role="alert"></p></div><details class="panel"><summary>Base64 decoder - display text only</summary><p>Copy one command_b64 value without JSON quotes. Decoding never executes it.</p><label>Encoded text<textarea id="encoded"></textarea></label><button id="decode" type="button">Decode as text</button><pre id="decoded" aria-live="polite"></pre></details><div id="records"></div><script>
const el=id=>document.getElementById(id);let rows=[];
function render(){const f=el('search').value.toLowerCase(),matches=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(f));el('records').replaceChildren();el('count').textContent=matches.length+' matching / '+rows.length+' records';for(const row of matches){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('pre');h.textContent=row.event_id||row.receipt_id||'Record';p.textContent=JSON.stringify(row,null,2);a.append(h,p);el('records').append(a);}}
el('file').onchange=async e=>{el('error').textContent='';try{const file=e.target.files[0];if(!file)return;if(file.size>5*1024*1024)throw Error('Choose a JSONL file below 5 MB.');rows=(await file.text()).split(/\r?\n/).filter(x=>x.trim()).map((line,i)=>{try{return JSON.parse(line);}catch{throw Error('Invalid JSON on line '+(i+1));}});el('search').value='';render();}catch(error){rows=[];render();el('error').textContent=error.message;}};
el('search').oninput=render;
function decodeBase64(value){const cleaned=value.replace(/\s+/g,'');if(!/^[A-Za-z0-9+/]*={0,2}$/.test(cleaned)||cleaned.length%4!==0)throw Error('Paste only the Base64 field value, without quotes or a field name.');const bytes=Uint8Array.from(atob(cleaned),c=>c.charCodeAt(0));return new TextDecoder('utf-8',{fatal:true}).decode(bytes);}
el('decode').onclick=()=>{try{el('decoded').textContent=decodeBase64(el('encoded').value);}catch(error){el('decoded').textContent=error.message;}};
</script></body></html>
